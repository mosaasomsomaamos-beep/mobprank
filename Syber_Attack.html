<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري تحديث النظام...</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }
        .spinner {
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top: 6px solid #3498db;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 { font-size: 22px; margin-bottom: 10px; }
        p { color: #888; font-size: 14px; }
    </style>
</head>
<body onclick="requestFullscreen()">

    <div class="spinner"></div>
    <h1>جاري تحسين الأداء وحذف الملفات المؤقتة...</h1>
    <p>الرجاء عدم إغلاق الشاشة أو إعادة تشغيل الهاتف (1 من 3)</p>

    <script>
        function requestFullscreen() {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }
        }
        // محاولة جعل الصفحة بملء الشاشة تلقائياً عند أول ضغطة
        setTimeout(() => {
            requestFullscreen();
        }, 500);
    </script>
</body>
</html>
